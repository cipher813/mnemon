name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Backstop against a hung test (e.g. a stalled cold model download)
    # stalling on the 6h default.
    timeout-minutes: 20
    env:
      # Pin the embedder (FastEmbed) + NLI (HF) model caches to a path we
      # restore via actions/cache below, so tests don't cold-download
      # ~100MB on every run — the source of an intermittent CI hang.
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.model-cache/fastembed
      HF_HOME: ${{ github.workspace }}/.model-cache/hf
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        # macOS is the primary dev platform — validate it on one Python
        # version to catch Mac-specific regressions without a full
        # cross-product of CI minutes. Windows is scoped out: mnemon's
        # runtime + deploy paths are unix-only (flyctl, ~/.mnemon paths,
        # 0600 file perms).
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Cache embedder + NLI models
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.model-cache
          key: mnemon-models-${{ runner.os }}-v1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage gate
        # Enforces the project's coverage floor (88%) per pyproject.toml
        # [tool.coverage.report] fail_under. Build fails if a PR drops
        # coverage below the gate. Configuration (source paths, omits,
        # exclude_lines) lives in pyproject.toml so this stays a one-line
        # invocation. --timeout is a per-test backstop: a stalled cold
        # model download fails that test fast instead of hanging the job.
        run: pytest tests/ -v --cov --cov-report=term-missing --timeout=300 --timeout-method=thread

  # The declared dependency FLOOR, measured. `pip install -e .` above resolves
  # to the newest mcp, so a floor that admits an unimportable version is
  # invisible to the matrix: `mcp>=1.27` shipped while persistent_sessions.py
  # imported mcp.server.connection (2.0+ only) — mnemon-I300. This leg pins
  # the floor and runs the whole suite, so raising the floor is the only way
  # to adopt a newer mcp API.
  deps-floor:
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.model-cache/fastembed
      HF_HOME: ${{ github.workspace }}/.model-cache/hf
    steps:
      - uses: actions/checkout@v7
      - name: Cache embedder + NLI models
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.model-cache
          key: mnemon-models-${{ runner.os }}-v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install at the declared mcp floor
        run: |
          set -euo pipefail
          FLOOR=$(python3 -c 'import re,tomllib; d=tomllib.load(open("pyproject.toml","rb")); s=[x for x in d["project"]["dependencies"] if x.startswith("mcp")][0]; print(re.search(r">=([0-9.]+)", s).group(1))')
          echo "mcp floor: $FLOOR"
          pip install -e ".[dev]" "mcp==$FLOOR"
          python -c 'import importlib.metadata as m; print("installed mcp", m.version("mcp"))'
      - name: Import every mnemon module, then the suite, at the floor
        run: |
          pytest tests/test_import_walk.py -q
          pytest tests/ -q --timeout=300 --timeout-method=thread

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for GitHub *org*
      # repos (free only for user repos). The cipher813 -> nousergon org
      # transfer broke this check, so use the free raw gitleaks binary instead
      # — same scan engine, no license. (see nousergon/mnemon#258)
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          # --retry-all-errors is load-bearing: plain --retry declines to retry some
          #   connection-level failures, and 56 (connection died) is one. Before this the
          #   command had no retry at all — a first-attempt drop failed the job in 190ms
          #   (alpha-engine-config-I7069).
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 120 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --no-banner --verbose
