name: System-wide deploy changelog

# Emits one JSON entry to s3://alpha-engine-research/changelog/ on every
# push-to-main. See nousergon-docs/.github/actions/append-changelog/README.md.
#
# Internal-only: assumes an AWS OIDC role in the maintainer's account, so
# it's guarded to the canonical repo — an external fork's push to its own
# main would otherwise get a spurious red "System-wide deploy changelog"
# run with no AWS access to satisfy it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changelog-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  append:
    if: github.repository == 'nousergon/mnemon'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Append to system-wide deploy changelog
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@6ed6c2050ecd4e87284283c7ee16539672704fc9 # main
        with:
          deploy_status: merged
          deploy_workflow: changelog.yml
